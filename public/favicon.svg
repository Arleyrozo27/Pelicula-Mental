<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Film reel circles -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Film holes (4 corners inside) -->
  <circle cx="35" cy="35" r="3" fill="white"/>
  <circle cx="65" cy="35" r="3" fill="white"/>
  <circle cx="35" cy="65" r="3" fill="white"/>
  <circle cx="65" cy="65" r="3" fill="white"/>
  
  <!-- Center star/sparkle -->
  <path d="M 50 40 L 52 48 L 60 50 L 52 52 L 50 60 L 48 52 L 40 50 L 48 48 Z" fill="white"/>
  
  <!-- Outer sparkles -->
  <circle cx="50" cy="25" r="2" fill="white" opacity="0.8"/>
  <circle cx="75" cy="50" r="2" fill="white" opacity="0.8"/>
  <circle cx="50" cy="75" r="2" fill="white" opacity="0.8"/>
  <circle cx="25" cy="50" r="2" fill="white" opacity="0.8"/>
</svg>
